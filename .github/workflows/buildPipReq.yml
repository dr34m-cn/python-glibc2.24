name: 安装pip依赖

on:
  push:
    branches: [ 'main' ]
    paths: [ 'requirements.txt', '.github/workflows/buildPipReq.yml' ]

env:
  DOCKER_USER: dr34m
  DOCKER_NAME: python_3.11.9_glibc_2.24

jobs:
  build-docker:
    name: 构建Docker
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        platform:
          - linux/amd64
          - linux/arm64
          - linux/arm/v7

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 替换平台名称中的斜杠为横杠
        run: |
          platform=${{ matrix.platform }}
          echo "PLATFORM_PAIR=${platform//\//-}" >> $GITHUB_ENV

      - name: 设置QEMU
        uses: docker/setup-qemu-action@v3

      - name: 设置Docker BuildX
        uses: docker/setup-buildx-action@v3

      - name: 登录到DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKER_USER }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - id: build-image
        name: 构建docker镜像
        uses: docker/build-push-action@v6
        with:
          file: dockerfiles/pip-req-${{ env.PLATFORM_PAIR }}.Dockerfile
          platforms: ${{ matrix.platform }}
          outputs: |
            type=docker
            type=image,name=${{ env.DOCKER_USER }}/${{ env.DOCKER_NAME }},push-by-digest=true,name-canonical=true,push=true

      - name: 导出digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build-image.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: 上传digest到artifact
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ env.PLATFORM_PAIR }}
          path: /tmp/digests/*
          retention-days: 1

      - name: 从镜像中提取 wheels
        run: |
          # 创建临时容器（无需运行），直接使用 build-image 步骤输出的本地 imageid
          # 加上 /bin/true 防止镜像默认 Entrypoint 导致创建报错
          docker create --name extract_${{ env.PLATFORM_PAIR }} ${{ steps.build-image.outputs.imageid }} /bin/true
          
          # 将容器内的 /wheels 拷贝到宿主机的 ./wheels_extracted 目录
          docker cp extract_${{ env.PLATFORM_PAIR }}:/wheels ./wheels_extracted
          
          # 清理临时容器
          docker rm extract_${{ env.PLATFORM_PAIR }}

      - name: 上传提取的 wheels 到 artifact
        uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ env.PLATFORM_PAIR }}
          path: ./wheels_extracted/*
          retention-days: 1

  merge-docker:
    name: 合并镜像上传
    runs-on: ubuntu-latest
    needs: [build-docker]
    steps:
      - name: 下载digest
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - name: 设置Docker BuildX
        uses: docker/setup-buildx-action@v3

      - name: 登录到DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKER_USER }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 创建清单并推送
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create -t ${{ env.DOCKER_USER }}/${{ env.DOCKER_NAME }}:pip-req $(printf '${{ env.DOCKER_USER }}/${{ env.DOCKER_NAME }}@sha256:%s ' *)
  
  commit-wheels:
    name: 提交提取的Wheels
    runs-on: ubuntu-latest
    needs: [build-docker]
    permissions:
      contents: write
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: 下载所有的 wheels artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          path: /tmp/wheels_downloads

      - name: 整理并覆盖本地 wheels 目录
        run: |
          # 清理旧的 wheels 防止多余废弃包残留
          rm -rf wheels/amd64/* wheels/arm64/* wheels/arm-v7/*
          
          # 确保目标目录存在
          mkdir -p wheels/amd64 wheels/arm64 wheels/arm-v7
          
          if [ -d "/tmp/wheels_downloads/wheels-linux-amd64" ]; then
            cp -a /tmp/wheels_downloads/wheels-linux-amd64/. wheels/amd64/
          fi
          if [ -d "/tmp/wheels_downloads/wheels-linux-arm64" ]; then
            cp -a /tmp/wheels_downloads/wheels-linux-arm64/. wheels/arm64/
          fi
          if [ -d "/tmp/wheels_downloads/wheels-linux-arm-v7" ]; then
            cp -a /tmp/wheels_downloads/wheels-linux-arm-v7/. wheels/arm-v7/
          fi

      - name: 提交并推送更改到仓库
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore(wheels): update cached wheels [skip ci]"
          file_pattern: 'wheels/'