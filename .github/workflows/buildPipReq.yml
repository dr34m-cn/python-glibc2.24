name: 安装pip依赖

on:
  push:
    branches: [ 'main' ]
    paths:
      - 'requirements.txt'
      - 'dockerfiles/**'
      - '.github/workflows/buildPipReq.yml'

env:
  DOCKER_USER: dr34m
  DOCKER_NAME: python_3.11.9_glibc_2.24
  WHEELS_BRANCH: wheels
  MIN_WHEEL_COUNT: 50

jobs:
  build-docker:
    name: 构建Docker
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        platform:
          - linux/amd64
          - linux/arm64
          - linux/arm/v7

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 从 wheels 分支检出缓存
        uses: actions/checkout@v4
        with:
          ref: ${{ env.WHEELS_BRANCH }}
          path: wheels
          persist-credentials: false

      - name: 去掉 wheels 检出中的 .git
        run: rm -rf wheels/.git

      - name: 替换平台名称中的斜杠为横杠
        run: |
          platform=${{ matrix.platform }}
          echo "PLATFORM_PAIR=${platform//\//-}" >> $GITHUB_ENV
          case "${platform}" in
            linux/amd64) echo "WHEELS_DIR=amd64" >> $GITHUB_ENV ;;
            linux/arm64) echo "WHEELS_DIR=arm64" >> $GITHUB_ENV ;;
            linux/arm/v7) echo "WHEELS_DIR=arm-v7" >> $GITHUB_ENV ;;
            *) echo "unknown platform ${platform}"; exit 1 ;;
          esac

      - name: 确认 wheels 缓存已就绪
        run: |
          set -eu
          test -d "wheels/${WHEELS_DIR}"
          count=$(find "wheels/${WHEELS_DIR}" -name '*.whl' | wc -l)
          echo "wheels/${WHEELS_DIR}: ${count} files"
          if [ "${count}" -lt "${{ env.MIN_WHEEL_COUNT }}" ]; then
            echo "wheels cache missing or incomplete"
            ls -la wheels || true
            exit 1
          fi

      - name: 设置QEMU
        uses: docker/setup-qemu-action@v3

      - name: 设置Docker BuildX
        uses: docker/setup-buildx-action@v3

      - name: 登录到DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKER_USER }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - id: build-image
        name: 构建docker镜像
        uses: docker/build-push-action@v6
        with:
          context: .
          file: dockerfiles/pip-req-${{ env.PLATFORM_PAIR }}.Dockerfile
          platforms: ${{ matrix.platform }}
          outputs: |
            type=docker
            type=image,name=${{ env.DOCKER_USER }}/${{ env.DOCKER_NAME }},push-by-digest=true,name-canonical=true,push=true

      - name: 从镜像中提取 wheels
        run: |
          set -eu
          docker create --name extract_${{ env.PLATFORM_PAIR }} ${{ steps.build-image.outputs.imageid }} /bin/true
          docker cp extract_${{ env.PLATFORM_PAIR }}:/wheels ./wheels_extracted
          docker rm extract_${{ env.PLATFORM_PAIR }}

          count=$(find ./wheels_extracted -name '*.whl' | wc -l)
          echo "extracted ${count} wheels for ${{ env.PLATFORM_PAIR }}"
          if [ "${count}" -lt "${{ env.MIN_WHEEL_COUNT }}" ]; then
            echo "refusing incomplete wheel cache: got ${count}, want at least ${{ env.MIN_WHEEL_COUNT }}"
            exit 1
          fi

      - name: 导出digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build-image.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: 上传digest到artifact
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ env.PLATFORM_PAIR }}
          path: /tmp/digests/*
          retention-days: 1

      - name: 上传提取的 wheels 到 artifact
        uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ env.PLATFORM_PAIR }}
          path: ./wheels_extracted/*
          retention-days: 1

  merge-docker:
    name: 合并镜像上传
    runs-on: ubuntu-latest
    needs: [build-docker]
    if: ${{ !cancelled() && needs.build-docker.result == 'success' }}
    steps:
      - name: 下载digest
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - name: 确认三个架构都构建成功
        run: |
          set -eu
          count=$(find /tmp/digests -type f | wc -l)
          echo "digest count: ${count}"
          if [ "${count}" -ne 3 ]; then
            echo "expected 3 platform digests before tagging pip-req, got ${count}"
            exit 1
          fi

      - name: 设置Docker BuildX
        uses: docker/setup-buildx-action@v3

      - name: 登录到DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKER_USER }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 创建清单并推送
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create -t ${{ env.DOCKER_USER }}/${{ env.DOCKER_NAME }}:pip-req $(printf '${{ env.DOCKER_USER }}/${{ env.DOCKER_NAME }}@sha256:%s ' *)

  commit-wheels:
    name: 提交提取的Wheels
    runs-on: ubuntu-latest
    needs: [build-docker]
    if: ${{ !cancelled() && needs.build-docker.result == 'success' }}
    permissions:
      contents: write
    steps:
      - name: 检出 wheels 分支
        uses: actions/checkout@v4
        with:
          ref: ${{ env.WHEELS_BRANCH }}

      - name: 下载所有的 wheels artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          path: /tmp/wheels_downloads

      - name: 整理并覆盖 wheels 分支缓存
        run: |
          set -eu
          mkdir -p amd64 arm64 arm-v7

          replace_if_complete() {
            src="$1"
            dest="$2"
            if [ ! -d "${src}" ]; then
              echo "missing extracted wheels: ${src}"
              exit 1
            fi
            count=$(find "${src}" -name '*.whl' | wc -l)
            echo "${dest}: ${count} wheels"
            if [ "${count}" -lt "${{ env.MIN_WHEEL_COUNT }}" ]; then
              echo "refusing to overwrite ${dest}: only ${count} wheels"
              exit 1
            fi
            rm -rf "${dest:?}/"*
            cp -a "${src}/." "${dest}/"
          }

          replace_if_complete /tmp/wheels_downloads/wheels-linux-amd64 amd64
          replace_if_complete /tmp/wheels_downloads/wheels-linux-arm64 arm64
          replace_if_complete /tmp/wheels_downloads/wheels-linux-arm-v7 arm-v7

      - name: 提交并推送到 wheels 分支
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          branch: wheels
          commit_message: "chore(wheels): update cached wheels"
          file_pattern: 'amd64/ arm64/ arm-v7/'
